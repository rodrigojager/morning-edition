# Every library and plugin version of the build lives here. Do not write a version anywhere else.
#
# Constraints the versions are chosen against (re-check them before bumping anything):
# - JDK 17 runs Gradle and the tests.
# - compileSdk = targetSdk = 35, minSdk = 28. AndroidX artifacts declare a minCompileSdk in their AAR metadata:
#   core 1.17+, activity 1.11+ and Compose 1.12+ (BOM 2026.08.00+) need compileSdk 36 or 37, so they stay below.
# - Kotlin 2.4.20-2.4.21 is tested with Gradle 7.6.3-9.7.0 and AGP 8.5.2-9.3.1 (kotlinlang.org compatibility table).
# - AGP 9.3 needs Gradle 9.5.0 or newer (developer.android.com AGP/Gradle table). The Gradle version itself is in
#   gradle/wrapper/gradle-wrapper.properties (9.7.0).
# - Robolectric 4.17 runs SDK 35 on Java 17. Its SDK 35 jar is pinned below (robolectric-android-all-sdk35) and
#   handed to the tests offline; when Robolectric or targetSdk changes, take the matching version from
#   DefaultSdkProvider of that Robolectric release.

[versions]
agp = "9.3.1"
kotlin = "2.4.21"
androidx-core = "1.16.0"
androidx-activity = "1.10.1"
compose-bom = "2026.06.01"
junit = "4.13.2"
androidx-test-ext-junit = "1.3.0"
kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
androidx-sqlite = "2.5.2"
robolectric = "4.17"
robolectric-android-all-sdk35 = "15-robolectric-13954326-i7"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all-sdk35 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-android-all-sdk35" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
